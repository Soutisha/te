<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>AUTONEXUS Living World</title>
<style>:root{--l:#2678f5;--b:#1558C9;--n:#2385FF;--m:#929BAA;--r:#FF3B3B}*{box-sizing:border-box}body{margin:0;background:#030407;color:#F5F7FA;font:12px 'JetBrains Mono',monospace;overflow:hidden}
canvas{display:block;position:fixed;inset:0}#hud{position:fixed;top:10px;left:10px;right:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;z-index:3}
button,select,input{background:var(--b);color:#fff;border:0;padding:9px 11px;font:inherit;cursor:pointer}select,input{background:#080A0D;border:1px solid #202A39;color:#F5F7FA;max-width:180px}input{width:105px}button.l{background:var(--l);color:#030407}button.r{background:#2a0f12;color:var(--r);border:1px solid var(--r)}
#tabs{position:fixed;top:54px;left:10px;display:flex;flex-wrap:wrap;gap:4px;z-index:3}#tabs button{background:#080A0Dcc;border:1px solid #202A39;color:var(--m);padding:7px 10px}#tabs button.on{background:var(--l);color:#030407;border-color:var(--l)}
#ph{background:#080A0D;border:1px solid #202A39;padding:8px 10px;color:var(--l)}#log{position:fixed;left:10px;bottom:10px;width:min(430px,92vw);background:#080A0Dcc;border:1px solid #202A39;padding:8px;z-index:3;max-height:34vh;overflow:hidden}
#log div{padding:2px 0;color:var(--m)}#log div:last-child{color:#F5F7FA}#ap{display:none;position:fixed;right:10px;top:60px;width:min(300px,90vw);background:#080A0D;border:1px solid var(--l);padding:12px;z-index:4}
#info{position:fixed;right:10px;bottom:10px;background:#080A0Dcc;border:1px solid #202A39;padding:8px;z-index:3;min-width:190px;max-width:min(380px,92vw);line-height:1.5}#fb{display:none;position:fixed;inset:0;padding:90px 20px;z-index:2}#fade{position:fixed;inset:0;background:#030407;opacity:0;pointer-events:none;z-index:5}
@media(max-width:700px){#tabs{top:96px}}</style>
<div id=hud><b style="color:var(--l)">AUTONEXUS · LIVING WORLD</b><span id=ph>connecting…</span><select id=dest title="Destination dealership"></select><select id=part title="Part"></select><input id=req type=number min=1 title="Required quantity; blank uses repair-order demand" placeholder="Auto demand"><select id=source title="Source site"><option value="">Best available source</option></select><button onclick=configureWorld()>APPLY INPUTS</button><button class=l onclick=cmd('start')>START</button><button onclick=cmd('block')>CLOSE ROAD AHEAD</button><button class=r onclick=cmd('reset')>RESET</button><a href="/" style="color:var(--m)">Operations</a></div>
<div id=tabs></div>
<div id=ap><b style="color:var(--l)">⏸ APPROVAL CHECKPOINT</b><p>Transfer is on hold. Nothing moves until the configured owner approves or rejects it.</p><button class=l onclick="cmd('approve')">APPROVE TRANSFER</button> <button class=r onclick=cmd('reject')>REJECT</button><p><a href="/#security" style="color:var(--l)">Sign in as the authorized owner ↗</a></p></div>
<div id=log></div><div id=info></div><div id=fb><h2>2D fallback (WebGL unavailable)</h2><pre id=fbt></pre></div><div id=fade></div>

<script>__GSAP__</script>
